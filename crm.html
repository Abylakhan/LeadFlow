<body data-auth="member" data-page="crm">
<main class="wrap page">
  <div class="page-head">
    <div><h1>CRM</h1><p class="muted">Перетаскивайте карточки между этапами. Нажмите на лида, чтобы написать ему, оставить заметку или поставить напоминание.</p></div>
    <div class="row gap wrap-row">
      <select id="who" style="width:auto" aria-label="Чьи лиды"><option value="all">Все лиды</option><option value="mine">Мои</option><option value="free">Свободные</option></select>
      <input id="q" type="search" placeholder="Поиск по названию, телефону…" style="width:240px" aria-label="Поиск по лидам">
      <div class="seg" role="tablist"><button data-view="board" class="on">Доска</button><button data-view="table">Таблица</button></div>
      <button id="exportCsv" class="btn">Экспорт CSV</button>
    </div>
  </div>
  <div id="stats" class="stats"></div>
  <div id="due"></div>
  <div id="board" class="kanban"></div>
  <div id="table" hidden></div>
</main>
